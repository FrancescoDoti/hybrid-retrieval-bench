[project]
name = "hrb"
version = "0.1.0"
description = "Hybrid retrieval benchmark: BM25, dense embeddings, rank fusion and cross-encoder reranking on BEIR, with fusion weights tuned on train queries and reported on test."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dense = ["sentence-transformers>=3.0", "torch>=2.2"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "anthropic>=0.40"]
dev = ["pytest>=7", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hrb"]
